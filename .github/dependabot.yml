# Wöchentliche Update-Vorschläge. Major-Updates von npm-Paketen und dem Node-Basis-Image
# werden bewusst manuell geplant (Umbauten nötig, Node nur LTS) – siehe docs/sicherheit.md E-003.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
