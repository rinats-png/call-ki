# Prüft jeden Push und Pull Request: Lint, Typen, Tests (inkl. Postgres-Integration),
# Abhängigkeiten, Secret-Scan und Docker-Build. Aktionen sind auf Commit-SHAs gepinnt (Regel 9.6).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callki
          POSTGRES_PASSWORD: callki
          POSTGRES_DB: callki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U callki" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://callki:callki@localhost:5432/callki_test
      TEST_DATABASE_URL: postgresql://callki:callki@localhost:5432/callki_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Installation aus Lockfile
        run: npm ci
      - name: Migrationen
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests (inkl. Mandantentrennung gegen Postgres)
        run: npm test
      - name: Abhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high
      - name: Build (Server-Geheimnisse mit Kanarienwerten)
        env:
          BUILD_CANARY: canary-7c1e0f9b2d4a
          APP_ENCRYPTION_KEY: canary-7c1e0f9b2d4a
          CRON_SECRET: canary-7c1e0f9b2d4a
          TWILIO_AUTH_TOKEN: canary-7c1e0f9b2d4a
          RETELL_API_KEY: canary-7c1e0f9b2d4a
        run: npm run build
      - name: Build-Scan auf Geheimnisse im Browser-Code
        run: BUILD_CANARY=canary-7c1e0f9b2d4a bash scripts/scan-build.sh
      - name: Browser für E2E-Tests
        run: npx playwright install --with-deps chromium
      - name: HTTP- und Browser-Tests gegen den Build (Zugriffsregeln, CSRF, 2FA, Re-Auth, Header)
        run: E2E_SKIP_BUILD=1 bash scripts/e2e.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret-Scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --no-banner

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker-Image bauen
        run: docker build -t callki:ci .
      - name: Compose-Datei prüfen
        run: |
          cp .env.example .env
          printf 'DOMAIN=ci.example.de\nPOSTGRES_PASSWORD=x\nCRON_SECRET=y\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f docker-compose.yml config --quiet
