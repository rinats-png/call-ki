# Produktion auf einem VPS (z. B. IONOS): App + PostgreSQL + Caddy (HTTPS) + Backups + Löschfristen.
# Start:  cp .env.example .env  →  Werte setzen  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: callki
      POSTGRES_USER: callki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callki -d callki"]
      interval: 10s
      timeout: 5s
      retries: 10
    # bewusst KEIN Port nach außen

  app:
    build: .
    # Version = Git-Commit (deploy/deploy.sh); ermöglicht den Rückweg auf das vorherige Image
    image: callki-app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://callki:${POSTGRES_PASSWORD}@db:5432/callki
      PUBLIC_BASE_URL: https://${DOMAIN:?DOMAIN fehlt in .env}
      # Überwachung erwartet tägliche Meldung des Backup-Dienstes
      BACKUP_EXPECTED: "true"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  # Tägliches, mit age verschlüsseltes Datenbank-Backup: lokal ./backups (14 Tage) und extern auf
  # S3 (z. B. IONOS Object Storage, 30 Tage). Monatlich automatischer Wiederherstellungstest.
  # Einrichtung: docs/betrieb.md → „Backups“.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: callki
      PGDATABASE: callki
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CRON_SECRET: ${CRON_SECRET}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_IDENTITY: /secrets/backup-age.key
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      RCLONE_CONFIG_REMOTE_TYPE: s3
      RCLONE_CONFIG_REMOTE_PROVIDER: Other
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - ./backups:/backups
      - ./deploy:/deploy:ro
      - ./secrets:/secrets:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache age rclone >/dev/null && exec /bin/sh /deploy/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Zeitgesteuerte Aufgaben: Wiederholung fehlgeschlagener Nachrichten (minütlich), Löschfristen (täglich)
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET fehlt in .env}
    volumes:
      - ./deploy/cron.sh:/cron.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec /bin/sh /cron.sh"]
    depends_on: [app]

volumes:
  db-data:
  caddy-data:
  caddy-config:
